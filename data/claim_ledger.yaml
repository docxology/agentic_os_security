# Claim ledger — numeric claims registered for the agentic_os_security review.
#
# Every number that appears in manuscript prose or analysis artifacts
# traces to a claim here. Fields:
#
#   claim_id:    unique slug.
#   kind:        always "number" for this ledger.
#   value:       the registered value.
#   source:      where the number comes from (bib key, constant name, or
#                manuscript token).
#   source_tier: project_source (source document), generated_metric
#                (computed by analysis), manuscript_claim (prose-level
#                contract constant), official_source (reporting party's
#                own figure; attribution caveats apply).
#   freshness:   "active" while the claim is in force.
#   artifact_path: file or bib key where the claim is enforced/stated.
#
# Attribution discipline (mirrors the source): official_source claims are
# the reporting party's own figures — Anthropic's is an investigating
# vendor's report, AISI's is its own incident report; none is an
# independently measured universal agent capability rate.

claims:
  - claim_id: ncsc_horizon_year
    kind: number
    value: 2027
    source: ncsc_ai_cyber_threat
    source_tier: official_source
    freshness: active
    artifact_path: src/agentic_os_security/evidence.py

