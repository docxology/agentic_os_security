# Agentic OS Security — manuscript configuration
# Meta-artifact linking manuscript prose to the execution layer. Loaded by
# `yaml.safe_load` inside `infrastructure/rendering/_pdf_combined_renderer.py`
# (manuscript metadata) and `scripts/z_generate_manuscript_variables.py`
# (review parameters).

# Consumed by: `infrastructure/rendering/pdf_renderer.py` and `infrastructure/reporting/pipeline_report_model.py`
paper:
  title: "Agentic Security and Operating Systems"
  version: "0.6.0"
  date: "" # Auto-generated (\today) by the title-page builder when empty
  cover:
    image: "output/figures/graphical_abstract.png"
    alt: "Graphical abstract: two failure paths — exploitation and authorized misuse — feed a nine-property evaluation of twenty-four operating systems, grouped into eight candidate classes with full-word stance counts, converging on the composition thesis: Qubes-like containment plus Nix-like reproducibility plus verified boot plus capability-limited agents as one design target."

# Consumed by: `infrastructure.publishing.extract_publication_metadata` (in `infrastructure/publishing/metadata.py`)
authors:
