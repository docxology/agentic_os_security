  language: "en"
  documentclass: "extarticle"
  fontsize: "9pt"
  geometry: "margin=0.15in"
# LLM reviews disabled for this private review project.
llm:
  reviews:
    enabled: false
  translations:
    enabled: false

# Consumed by: `infrastructure/reporting/pipeline_report_model.py` and CI/CD gates
