# Render format toggles — gate per-renderer in infrastructure/rendering/pipeline.py.
render:
  formats:
    pdf: true
    html: true

# Title-page rendering options — cover_height_fraction scales the cover
# image height as a fraction of \textheight in the title-page builder.
rendering:
  cover_height_fraction: 0.72
metadata:
